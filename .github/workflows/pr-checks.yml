name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Smoke test
        run: node tests/smoke.mjs
