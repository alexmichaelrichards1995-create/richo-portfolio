name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then npm ci || true; fi

      - name: Set webhook secret env
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: echo "WEBHOOK_SECRET present: ${GITHUB_WEBHOOK_SECRET:+yes}"

      - name: Run tests
        env:
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          node tests/marketplace_webhook_handler.test.js
          node tests/marketplace_webhook_handler.idempotency.test.js
          node tests/webhook_signature.integration.test.js
