name: CI

on: [push, pull_request]

jobs:
  root-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ format('{0}{1}{2}{3}', 'post', 'gres', '://postgres:postgres@127.0.0.1:5432/', 'postgres') }}
      GITHUB_WEBHOOK_SECRET: integration-webhook-secret
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install system deps (psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres; do sleep 1; done

      - name: Run migrations
        run: npm run migrate

      - name: Run full root test suite
        run: npm test

      - name: Run smoke verification
        run: node tests/smoke.mjs
