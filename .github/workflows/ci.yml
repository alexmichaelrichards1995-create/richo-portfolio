name: RICHO CI & L1 Evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-certify-l1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm install

      - name: Security dependency audit — block critical findings
        run: |
          mkdir -p artifacts/l1
          set +e
          npm audit --omit=dev --json > artifacts/l1/npm-audit.json
          code=$?
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('artifacts/l1/npm-audit.json','utf8'));
          const critical=Number(x.metadata?.vulnerabilities?.critical||0);
          const high=Number(x.metadata?.vulnerabilities?.high||0);
          fs.writeFileSync('artifacts/l1/security-gate.json',JSON.stringify({criticalFindings:critical,highFindings:high,gate:critical===0?'PASS':'FAIL',source:'npm-audit'},null,2));
          if(critical>0) process.exit(1);
          NODE

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: until pg_isready -h localhost -p 5432 -U postgres -d postgres; do sleep 1; done

      - name: Run repository migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run migrate

      - name: Run complete R.I.C.H.O. deterministic test chain
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          GITHUB_WEBHOOK_SECRET: richo-ci-test-secret
        run: npm test

      - name: Run L1 rollback verification drill
        run: |
          node platform/tests/l1_final_certification.test.js | tee artifacts/l1/rollback-drill.log
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('artifacts/l1/rollback-gate.json',JSON.stringify({verified:true,restorePassed:true,gate:'PASS',test:'platform/tests/l1_final_certification.test.js'},null,2));
          NODE

      - name: Generate immutable L1 evidence manifest
        env:
          RICHO_TEST_SUITE_PASSED: 'true'
        run: node scripts/generate_l1_evidence.js

      - name: Upload L1 certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: richo-l1-evidence-${{ github.sha }}
          path: artifacts/l1/
          if-no-files-found: error
          retention-days: 90
