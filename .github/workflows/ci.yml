name: RICHO CI & L1 Evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-certify-l1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm install

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: until pg_isready -h localhost -p 5432 -U postgres -d postgres; do sleep 1; done

      - name: Run repository migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run migrate

      - name: Run complete R.I.C.H.O. deterministic test chain
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          GITHUB_WEBHOOK_SECRET: richo-ci-test-secret
        run: npm test

      - name: Generate immutable L1 evidence manifest
        env:
          RICHO_TEST_SUITE_PASSED: 'true'
        run: node scripts/generate_l1_evidence.js

      - name: Upload L1 certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: richo-l1-evidence-${{ github.sha }}
          path: artifacts/l1/l1-evidence.json
          if-no-files-found: error
          retention-days: 90
