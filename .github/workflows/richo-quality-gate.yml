name: RICHO Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: richo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: richo
          POSTGRES_PASSWORD: richo_test
          POSTGRES_DB: richo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U richo -d richo_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://richo:richo_test@localhost:5432/richo_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Apply database migrations
        env:
          PGPASSWORD: richo_test
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U richo -d richo_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run RICHO test suite
        run: npm test
      - name: Validate Docker build
        run: docker build -t richo-portfolio:ci .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current PR tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Scan current repository state for secrets
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.3
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose

  quality-summary:
    name: Quality gate
    if: always()
    needs: [test, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
        run: |
          echo "Tests: $TEST_RESULT"
          echo "Secret scan: $SECRET_RESULT"
          test "$TEST_RESULT" = "success"
          test "$SECRET_RESULT" = "success"
