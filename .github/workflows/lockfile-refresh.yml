name: Integration Lockfile Refresh

on:
  push:
    branches:
      - agent/integrate-commerce-marketplace
    paths:
      - 'package.json'
      - 'github-app/package.json'
      - '.github/workflows/lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: ${{ !contains(github.event.head_commit.message, 'Commit generated npm lockfiles') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/integrate-commerce-marketplace

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate GitHub App lockfile
        working-directory: github-app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated npm lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json github-app/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already match package manifests.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Commit generated npm lockfiles'
          git push origin HEAD:agent/integrate-commerce-marketplace
