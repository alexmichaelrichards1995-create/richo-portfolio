name: PayCore Vercel Build Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'migrations/**'
      - 'tests/**'
      - 'paycore_*.js'
      - 'stripe_payment_webhook.js'
      - 'posthog_server.js'
      - 'index.html'
      - 'checkout.js'
      - 'analytics.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/paycore-vercel-build.yml'

permissions:
  contents: read

concurrency:
  group: paycore-vercel-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_nelzyuU71azKli5ThIr26ppU
  VERCEL_PROJECT_ID: prj_zrBxApzFOjSTnBHTmsa9P17EHAtf
  VERCEL_CLI_VERSION: 55.0.0

jobs:
  build-preview-artifact-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install app dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Require Vercel authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is not configured in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Pull preview project configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@${VERCEL_CLI_VERSION} pull \
            --yes \
            --environment=preview \
            --git-branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --token="$VERCEL_TOKEN"

      - name: Build preview artifact only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deliberately build-only. Do not add `vercel deploy`, `--prod`,
          # `vercel promote`, or any production-alias mutation to this workflow.
          npx --yes vercel@${VERCEL_CLI_VERSION} build \
            --target=preview \
            --yes \
            --token="$VERCEL_TOKEN"

      - name: Verify Vercel build output
        run: |
          set -euo pipefail
          test -d .vercel/output
          test -f .vercel/output/config.json
          echo "Vercel preview build artifact generated successfully; nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
