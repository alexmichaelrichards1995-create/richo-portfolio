name: Shopify App CI

on:
  push:
    paths:
      - 'shopify-app/**'
      - '.github/workflows/shopify-app-ci.yml'
  pull_request:
    paths:
      - 'shopify-app/**'
      - '.github/workflows/shopify-app-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shopify-app/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run typecheck
