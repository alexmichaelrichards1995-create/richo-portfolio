  <defs>
    <style>text{font-family:Inter, Arial, sans-serif;fill:#eef6ff;} .muted{fill:#9fb2c7;font-size:20px;} .h{font-size:48px;font-weight:700;} .btn{fill:#6ee7ff;stroke:#04121d;stroke-width:2}</style>
  </defs>
  <rect width="100%" height="100%" fill="#07111f" rx="8"/>
